name: Build and Release Multi-Platform Apps

on:
  push:
    tags:
      - "v*"

jobs:
  build-desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Bundle
        run: npm run build:web

      - name: Build Windows .exe
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish never

      - name: Build Linux targets
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --publish never

      - name: Build macos .dmg & .zip
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac dmg zip --publish never

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-artifacts-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.tar.gz
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.rpm

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk

  build-ios:
    runs-on: macos-latest
    steps: 
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Prebuild ios Native Project
        run: npx expo prebuild --platform ios

      - name: Build iOS Simulator App
        run: |
          cd ios
          pod install
          xcodebuild -workspace TimeManagement.xcworkspace -scheme TimeManagement -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=No

      - name: Compress iOS App
        run: |
          cd ios/build/Build/Products/Release-iphonesimulator
          tar -czf Time-Management-ios-Simulator.tar.gz "TimeManagement.app"

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: ios/build/Build/Products/Release-iphonesimulator/Time-Management-ios-Simulator.tar.gz

  create-release:
    needs: [build-desktop, build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop-artifacts-windows-latest/*.exe
            desktop-artifacts-ubuntu-latest/*.tar.gz
            desktop-artifacts-ubuntu-latest/*.AppImage
            desktop-artifacts-ubuntu-latest/*.deb
            desktop-artifacts-ubuntu-latest/*.rpm
            desktop-artifacts-macos-latest/*.dmg
            desktop-artifacts-macos-latest/*.zip
            android-apk/*.apk
            ios-app/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}